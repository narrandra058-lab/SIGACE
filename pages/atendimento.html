<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIGACE - Novo Atendimento</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="topo">
        <h1>SIGACE</h1>

        <a href="dashboard.html">
            Voltar ao painel
        </a>
    </header>

    <main class="form-container">

        <h2>Novo Atendimento</h2>

        <p>
            Preencha os dados para registrar um novo atendimento.
        </p>

        <form id="formAtendimento">

            <label for="nome">
                Nome do cliente
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do cliente"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite o e-mail"
            >

            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder="Digite o telefone"
            >

            <label for="assunto">
                Assunto
            </label>

            <input
                type="text"
                id="assunto"
                placeholder="Informe o assunto"
                required
            >

            <label for="descricao">
                Descrição do atendimento
            </label>

            <textarea
                id="descricao"
                rows="5"
                placeholder="Descreva o atendimento"
                required
            ></textarea>

            <label for="status">
                Status
            </label>

            <select id="status">
                <option value="Em andamento">
                    Em andamento
                </option>

                <option value="Pendente">
                    Pendente
                </option>

                <option value="Finalizado">
                    Finalizado
                </option>
            </select>

            <button type="submit">
                Registrar Atendimento
            </button>

        </form>

    </main>

    <script src="../js/script.js"></script>

</body>
</html>
