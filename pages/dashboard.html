<!DOCTYPE html>
<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
</head>

            Bem-vindo ao Sistema de Gestão e Atendimento ao Cliente.

            <div class="card">

            <div class="card">

            </div>

        </section>

        <section class="acoes">

            <h2>Ações</h2>

            <a href="atendimento.html">
                <button type="button">
                    Novo Atendimento
                </button>
            </a>

            <a href="historico.html">
                <button type="button">
                    Ver Histórico
                </button>
            </a>

    <script src="../js/script.js"></script>

</html>
